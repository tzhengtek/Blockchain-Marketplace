[package]
name = "database"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = { version = "3.15.0", features = ["chrono"] }
sqlx = { version = "0.8.6", features = ["chrono", "macros", "postgres", "runtime-tokio"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
