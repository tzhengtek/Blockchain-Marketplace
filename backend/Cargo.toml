[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
axum-macros = "0.5.0"
chrono = "0.4.42"
database = { workspace = true }
indexer = { workspace = true }
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["tls-rustls"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "axum"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
tower-http = { version = "0.6.6", features = ["cors", "tower"] }
http = "1.3.1"
